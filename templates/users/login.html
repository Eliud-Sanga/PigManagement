{% load static %}

<!DOCTYPE html>

<html lang="sw">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ingia - Pig Management</title>

    <link
        rel="manifest"
        href="{% static 'manifest.json' %}"
    >

    <meta
        name="theme-color"
        content="#198754"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <link
        rel="apple-touch-icon"
        href="{% static 'icons/icon-192.png' %}"
    >

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* =====================================================
       BODY
    ===================================================== */

    body {

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        font-family:
            'Segoe UI',
            Tahoma,
            Geneva,
            Verdana,
            sans-serif;

        background:
            linear-gradient(
                -45deg,
                #020617,
                #0f172a,
                #172554,
                #312e81,
                #0f172a
            );

        background-size: 400% 400%;

        animation:
            backgroundMove 14s ease infinite;

        padding: 15px;

        overflow: hidden;

        position: relative;

        isolation: isolate;
    }


    @keyframes backgroundMove {

        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background-position: 0% 50%;
        }

    }


    /* =====================================================
       ANIMATED BODY BORDER
    ===================================================== */

    body {

        border: 2px solid transparent;

        border-image:
            linear-gradient(
                120deg,
                #ff0055,
                #7c3aed,
                #2563eb,
                #00e5ff,
                #22c55e,
                #facc15,
                #ff0055
            ) 1;

        animation:
            bodyBorderColor 8s linear infinite;
    }


    @keyframes bodyBorderColor {

        0% {
            border-image-source:
                linear-gradient(
                    120deg,
                    #ff0055,
                    #7c3aed,
                    #2563eb,
                    #00e5ff,
                    #22c55e,
                    #facc15
                );
        }

        25% {
            border-image-source:
                linear-gradient(
                    120deg,
                    #00e5ff,
                    #22c55e,
                    #facc15,
                    #ff0055,
                    #7c3aed,
                    #2563eb
                );
        }

        50% {
            border-image-source:
                linear-gradient(
                    120deg,
                    #7c3aed,
                    #2563eb,
                    #00e5ff,
                    #22c55e,
                    #facc15,
                    #ff0055
                );
        }

        75% {
            border-image-source:
                linear-gradient(
                    120deg,
                    #22c55e,
                    #facc15,
                    #ff0055,
                    #7c3aed,
                    #2563eb,
                    #00e5ff
                );
        }

        100% {
            border-image-source:
                linear-gradient(
                    120deg,
                    #ff0055,
                    #7c3aed,
                    #2563eb,
                    #00e5ff,
                    #22c55e,
                    #facc15
                );
        }

    }


    /* =====================================================
       BACKGROUND GLOW
    ===================================================== */

    body::before {

        content: "";

        position: fixed;

        width: 420px;

        height: 420px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(37, 99, 235, 0.25),
                transparent 68%
            );

        top: -180px;

        left: -150px;

        filter: blur(15px);

        animation:
            floatingGlow 9s ease-in-out infinite;

        pointer-events: none;

        z-index: -2;
    }


    body::after {

        content: "";

        position: fixed;

        width: 430px;

        height: 430px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(168, 85, 247, 0.22),
                transparent 68%
            );

        bottom: -190px;

        right: -150px;

        filter: blur(15px);

        animation:
            floatingGlowReverse 11s ease-in-out infinite;

        pointer-events: none;

        z-index: -2;
    }


    @keyframes floatingGlow {

        0%,
        100% {

            transform:
                translate(0, 0)
                scale(1);

        }

        50% {

            transform:
                translate(90px, 80px)
                scale(1.15);

        }

    }


    @keyframes floatingGlowReverse {

        0%,
        100% {

            transform:
                translate(0, 0)
                scale(1);

        }

        50% {

            transform:
                translate(-80px, -70px)
                scale(1.12);

        }

    }


    /* =====================================================
       LOGIN WRAPPER
    ===================================================== */

    .login-wrapper {

        width: 100%;

        max-width: 370px;

        position: relative;

        z-index: 10;

        animation:
            fadeIn 0.65s ease-out;
    }


    @keyframes fadeIn {

        from {

            opacity: 0;

            transform:
                translateY(-18px)
                scale(0.98);

        }

        to {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

        }

    }


    /* =====================================================
       LOGIN CARD
    ===================================================== */

    .login-card {

        position: relative;

        background:
            rgba(255, 255, 255, 0.97);

        backdrop-filter:
            blur(14px);

        border-radius: 19px;

        padding:
            28px 27px 22px;

        box-shadow:
            0 20px 55px
            rgba(0, 0, 0, 0.40),

            0 0 0 1px
            rgba(255, 255, 255, 0.15);

        overflow: hidden;

        isolation: isolate;

        border: 3px solid transparent;
        border-radius: 12px;

        border-image:
            linear-gradient(
                120deg,
                #ff0055,
                #7c3aed,
                #2563eb,
                #00e5ff,
                #22c55e,
                #facc15,
                #ff0055
            ) 1;

        animation:
            cardBorderColor 7s linear infinite;
    }


    @keyframes cardBorderColor {

        0% {

            border-image-source:
                linear-gradient(
                    120deg,
                    #ff0055,
                    #7c3aed,
                    #2563eb,
                    #00e5ff,
                    #22c55e,
                    #facc15
                );

        }

        25% {

            border-image-source:
                linear-gradient(
                    120deg,
                    #00e5ff,
                    #22c55e,
                    #facc15,
                    #ff0055,
                    #7c3aed,
                    #2563eb
                );

        }

        50% {

            border-image-source:
                linear-gradient(
                    120deg,
                    #7c3aed,
                    #2563eb,
                    #00e5ff,
                    #22c55e,
                    #facc15,
                    #ff0055
                );

        }

        75% {

            border-image-source:
                linear-gradient(
                    120deg,
                    #22c55e,
                    #facc15,
                    #ff0055,
                    #7c3aed,
                    #2563eb,
                    #00e5ff
                );

        }

        100% {

            border-image-source:
                linear-gradient(
                    120deg,
                    #ff0055,
                    #7c3aed,
                    #2563eb,
                    #00e5ff,
                    #22c55e,
                    #facc15
                );

        }

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .login-header {

        text-align: center;

        margin-bottom: 23px;
    }


    /* =====================================================
       IMAGE RING
    ===================================================== */

    .image-ring {

        width: 82px;

        height: 82px;

        margin:
            0 auto 11px;

        padding: 3px;

        border-radius: 50%;

        background:
            conic-gradient(
                #ff0055,
                #ff8a00,
                #ffe600,
                #22c55e,
                #00e5ff,
                #2563eb,
                #7c3aed,
                #ff0055
            );


        box-shadow:
            0 0 12px
            rgba(37, 99, 235, 0.35),

            0 0 28px
            rgba(124, 58, 237, 0.22);

        display: flex;

        align-items: center;

        justify-content: center;

        position: relative;
    }


    .image-ring::before {

        content: "";

        position: absolute;

        width: 76px;

        height: 76px;

        border-radius: 50%;

        background: white;
    }


    .login-image {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        position: relative;
        z-index: 2;
        border: 2px solid white;
        background: #e2e8f0;
    }

    @keyframes rotateRing {

        from {

            transform:
                rotate(0deg);

        }

        to {

            transform:
                rotate(360deg);

        }

    }


    /* =====================================================
       HEADER TEXT
    ===================================================== */

    .login-header h1 {

        color: #0f172a;

        font-size: 23px;

        font-weight: 800;

        line-height: 1.2;
    }


    .login-header p {

        color: #64748b;

        font-size: 12px;

        margin-top: 5px;
    }


    .login-header .subtitle {

        display: block;

        color: #2563eb;

        font-size: 11px;

        font-weight: 750;

        margin-top: 7px;

        letter-spacing: 0.4px;
    }


    .decorative-line {

        width: 45px;

        height: 3px;

        background:
            linear-gradient(
                90deg,
                #2563eb,
                #7c3aed
            );

        border-radius: 3px;

        margin: 10px auto 0;
    }


    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {

        margin-bottom: 14px;
    }


    .message {

        padding:
            9px 12px;

        border-radius: 8px;

        font-size: 12px;

        font-weight: 600;

        margin-bottom: 7px;

        line-height: 1.4;
    }


    .message:last-child {

        margin-bottom: 0;
    }


    .message.error {

        background: #fee2e2;

        color: #991b1b;

        border:
            1px solid #fecaca;
    }


    .message.success {

        background: #dcfce7;

        color: #166534;

        border:
            1px solid #bbf7d0;
    }


    .message.warning {

        background: #fef3c7;

        color: #92400e;

        border:
            1px solid #fde68a;
    }


    .message.info {

        background: #dbeafe;

        color: #1e40af;

        border:
            1px solid #bfdbfe;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-group {

        margin-bottom: 15px;
    }


    .form-group label {

        display: block;

        font-weight: 700;

        color: #1e293b;

        font-size: 12px;

        margin-bottom: 6px;
    }


    .input-wrapper {

        position: relative;
    }


    .form-group input {

        width: 100%;

        padding:
            11px 13px;

        border:
            1px solid #cbd5e1;

        border-radius: 10px;

        font-size: 13px;

        transition:
            border-color 0.25s ease,
            box-shadow 0.25s ease,
            background 0.25s ease,
            transform 0.25s ease;

        background:
            linear-gradient(
                145deg,
                #f8fafc,
                #f1f5f9
            );

        color: #0f172a;

        outline: none;

        box-shadow:
            inset 0 1px 2px
            rgba(15, 23, 42, 0.04);
    }


    .password-input {

        padding-right: 42px !important;
    }


    .form-group input::placeholder {

        color: #94a3b8;
    }


    .form-group input:hover {

        border-color:
            #94a3b8;

        background:
            #ffffff;
    }


    .form-group input:focus {

        border-color:
            #2563eb;

        background:
            #ffffff;

        transform:
            translateY(-1px);

        box-shadow:
            0 0 0 3px
            rgba(37, 99, 235, 0.09),

            0 5px 15px
            rgba(37, 99, 235, 0.10);
    }


    /* =====================================================
       PASSWORD TOGGLE
    ===================================================== */

    .password-toggle {

        position: absolute;

        right: 10px;

        top: 50%;

        transform:
            translateY(-50%);

        border: none;

        background: transparent;

        color: #64748b;

        cursor: pointer;

        font-size: 13px;

        padding: 4px;

        transition:
            color 0.2s ease,
            transform 0.2s ease;
    }


    .password-toggle:hover {

        color: #2563eb;

        transform:
            translateY(-50%)
            scale(1.1);
    }


    /* =====================================================
       REMEMBER ROW
    ===================================================== */

    .remember-row {

        display: flex;

        align-items: center;

        justify-content:
            space-between;

        gap: 10px;

        margin-bottom: 17px;
    }


    .checkbox-group {

        display: flex;

        align-items: center;

        gap: 7px;
    }


    .checkbox-group input {

        width: 15px;

        height: 15px;

        accent-color:
            #2563eb;

        cursor: pointer;
    }


    .checkbox-group label {

        color: #475569;

        font-size: 12px;

        cursor: pointer;
    }


    .login-hint {

        color: #94a3b8;

        font-size: 10px;

        text-align: right;
    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    .btn-login {

        position: relative;

        width: 100%;

        padding: 12px;

        background:
            linear-gradient(
                120deg,
                #1d4ed8,
                #2563eb,
                #7c3aed,
                #2563eb,
                #1d4ed8
            );

        background-size:
            250% 100%;

        color: white;

        border: none;

        border-radius: 10px;

        font-size: 13px;

        font-weight: 750;

        cursor: pointer;

        overflow: hidden;

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease;

        box-shadow:
            0 6px 16px
            rgba(37, 99, 235, 0.25);

        animation:
            buttonGradient 5s ease infinite;
    }


    @keyframes buttonGradient {

        0% {

            background-position:
                0% 50%;

        }

        50% {

            background-position:
                100% 50%;

        }

        100% {

            background-position:
                0% 50%;

        }

    }


    .btn-login::before {

        content: "";

        position: absolute;

        top: 0;

        left: -80%;

        width: 55%;

        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.35),
                transparent
            );

        transform:
            skewX(-20deg);

        transition:
            left 0.55s ease;
    }


    .btn-login:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 10px 25px
            rgba(37, 99, 235, 0.38),

            0 0 18px
            rgba(124, 58, 237, 0.18);
    }


    .btn-login:hover::before {

        left: 125%;
    }


    .btn-login:active {

        transform:
            translateY(0);

        box-shadow:
            0 4px 10px
            rgba(37, 99, 235, 0.25);
    }


    .btn-login:disabled {

        opacity: 0.7;

        cursor: not-allowed;

        transform: none;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .login-footer {

        text-align: center;

        margin-top: 18px;

        color: #94a3b8;

        font-size: 10px;

        line-height: 1.5;
    }


    .login-footer strong {

        color: #2563eb;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 420px) {

        body {
            padding: 6px;
            border-width: 1px;
        }

        .login-card {
            padding: 18px 15px 15px;
            border-radius: 6px;
            border-width: 2px;
        }

        .image-ring {
            width: 70px;
            height: 70px;
        }

        .image-ring::before {
            width: 64px;
            height: 64px;
        }

        .login-image {
            width: 64px;
            height: 64px;
        }

        .login-header {
            margin-bottom: 17px;
        }

        .login-header h1 {
            font-size: 20px;
        }

    }


    /* =====================================================
       VERY SMALL SCREENS
    ===================================================== */

    @media (max-width: 340px) {

        body {

            padding: 8px;

        }


        .login-card {

            padding:
                20px 15px 17px;

        }


        .login-header h1 {

            font-size: 19px;

        }


        .remember-row {

            flex-direction: column;

            align-items: flex-start;

            gap: 7px;

        }


        .login-hint {

            text-align: left;

        }

    }

</style>

</head>

<body>

<div class="rgb-band"></div>

<div class="login-wrapper">

<div class="login-card">


    <div class="login-header">


        <div class="image-ring">

            <img
                src="{% static 'users/eliud.jpeg' %}"
                alt="Pig Management"
                class="login-image"
            >

        </div>


        <h1>
            Pig Management
        </h1>


        <p>
            Karibu tena
        </p>


        <div class="decorative-line"></div>


        <span class="subtitle">
            Ingia kuendelea
        </span>

    </div>


    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div
                    class="message {{ message.tags }}"
                >
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <form
        method="post"
        id="loginForm"
    >

        {% csrf_token %}


        <div class="form-group">

            <label for="username">
                Jina la Mtumiaji
            </label>


            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
                autofocus
            >

        </div>


        <div class="form-group">

            <label for="password">
                Nenosiri
            </label>


            <div class="input-wrapper">


                <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Nenosiri"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Onyesha nenosiri"
                >
                    👁
                </button>

            </div>

        </div>


        <div class="remember-row">

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="remember_me"
                    name="remember_me"
                >

                <label for="remember_me">
                    Nikumbuke
                </label>

            </div>


            <span class="login-hint">
                Weka taarifa sahihi
            </span>

        </div>


        <button
            type="submit"
            class="btn-login"
            id="loginButton"
        >
            Ingia
        </button>


    </form>


    <div class="login-footer">

        <p>
            © 2026
            <strong>Pig Management</strong>
        </p>

        <p>
            Mfumo salama wa usimamizi
        </p>

    </div>


</div>

</div>

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            const password =
                document.getElementById(
                    "password"
                );


            const passwordToggle =
                document.getElementById(
                    "passwordToggle"
                );


            if (
                password &&
                passwordToggle
            ) {

                passwordToggle.addEventListener(
                    "click",
                    function () {

                        if (
                            password.type ===
                            "password"
                        ) {

                            password.type =
                                "text";

                            passwordToggle.textContent =
                                "🙈";

                            passwordToggle.setAttribute(
                                "aria-label",
                                "Ficha nenosiri"
                            );

                        } else {

                            password.type =
                                "password";

                            passwordToggle.textContent =
                                "👁";

                            passwordToggle.setAttribute(
                                "aria-label",
                                "Onyesha nenosiri"
                            );

                        }

                    }
                );

            }


            const form =
                document.getElementById(
                    "loginForm"
                );


            const loginButton =
                document.getElementById(
                    "loginButton"
                );


            if (
                form &&
                loginButton
            ) {

                form.addEventListener(
                    "submit",
                    function () {

                        loginButton.disabled =
                            true;

                        loginButton.textContent =
                            "Inaingia...";

                    }
                );

            }

            /* =====================================================
            SERVICE WORKER
            ===================================================== */

            if ("serviceWorker" in navigator) {

                navigator.serviceWorker
                    .register("/service-worker.js")
                    .then(function (registration) {

                        console.log(
                            "Service Worker registered:",
                            registration.scope
                        );

                    })
                    .catch(function (error) {

                        console.error(
                            "Service Worker registration failed:",
                            error
                        );

                    });

            }

        }

    );

</script>

</body>

</html>
